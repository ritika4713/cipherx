<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CipherX – Secure File Encryption and Decryption Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#e3efe8;--sheet:#f7fbf8;--field:#fff;--ink:#10302a;--mute:#46635a;
  --green:#0e4a3a;--on-green:#f7fbf8;--bronze:#b8862b;--hair:rgba(14,74,58,.06);
  --err:#9b1c1c;--ok:#0e4a3a;--sel:#b9dccb;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0b1f1a;--sheet:#10302a;--field:#0b1f1a;--ink:#e3efe8;--mute:#a3c1b5;
  --green:#8fd3b6;--on-green:#0b1f1a;--bronze:#d9a94a;--hair:rgba(143,211,182,.06);
  --err:#ff9d9d;--ok:#8fd3b6;--sel:#1f5a47;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,520px);justify-content:center;align-content:center;padding:32px 16px;overflow-x:hidden;
  background:var(--paper) repeating-linear-gradient(90deg,var(--hair) 0 1px,transparent 1px 7px);
  color:var(--ink);font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  caret-color:var(--green);
}
::selection{background:var(--sel);color:var(--ink)}
*{scrollbar-color:var(--green) var(--paper)}

main{
  position:relative;min-width:0;padding:34px;
  background:var(--sheet);border:2px solid var(--green);outline:1px solid var(--green);outline-offset:6px;
  box-shadow:0 18px 40px -18px rgba(11,31,26,.35);
}
.rosette{position:absolute;right:-70px;top:-70px;width:260px;height:260px;pointer-events:none;z-index:0;animation:turn 120s linear infinite}
.rosette path{fill:none;stroke:var(--green);stroke-width:.7;opacity:.8}
.rosette path+path{stroke:var(--bronze)}
main.busy .rosette{animation-duration:6s}
@keyframes turn{to{transform:rotate(360deg)}}
main>*:not(.rosette){position:relative;z-index:1}

.band{
  display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:14px;height:calc(1.6em + 8px);
  margin:18px 0 0;padding:3px 0;border-block:1px solid var(--green);overflow:hidden;
  font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;line-height:1.6;color:var(--green);opacity:.75;
  user-select:none;
}
.band span{white-space:nowrap}
h1{margin:0;font-size:2.75rem;line-height:1;font-weight:700;letter-spacing:-.03em}
.sub{margin:12px 0 28px;max-width:30ch;color:var(--mute);text-wrap:balance}

label{display:block;margin:0 0 6px;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.hint{display:block;margin:-2px 0 8px;font-size:.82rem;color:var(--mute)}
input[type=password],input[type=file]{
  width:100%;margin:0 0 20px;padding:12px;background:var(--field);color:var(--ink);
  border:1.5px solid var(--green);border-radius:0;font:inherit;
}
input[type=file]::file-selector-button{
  margin-right:12px;padding:6px 12px;border:1.5px solid var(--green);border-radius:0;background:transparent;color:var(--green);font:600 .85rem "Hanken Grotesk",sans-serif;cursor:pointer;
}
input:focus-visible,button:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}

.row{display:flex;gap:12px}
button{
  flex:1;padding:13px 12px;border:1.5px solid var(--green);border-radius:0;font:600 1rem "Hanken Grotesk",sans-serif;cursor:pointer;
  transition:background-color .2s cubic-bezier(.16,1,.3,1),color .2s cubic-bezier(.16,1,.3,1),transform .2s cubic-bezier(.16,1,.3,1);
}
#enc{background:var(--green);color:var(--on-green)}
#dec{background:transparent;color:var(--green)}
#dec:hover:not(:disabled){background:var(--green);color:var(--on-green)}
#enc:hover:not(:disabled){transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:progress}

#msg{min-height:1.6em;margin:18px 0 0;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#msg:not(:empty){padding-top:12px;border-top:1px solid var(--green)}
.err{color:var(--err)}.ok{color:var(--ok)}
small{display:block;margin-top:22px;padding-top:14px;border-top:1px solid var(--green);font-size:.8rem;line-height:1.55;color:var(--mute)}

@media (max-width:480px){
  main{padding:24px 20px}
  .rosette{width:180px;height:180px;right:-50px;top:-50px}
  h1{font-size:2.25rem}
  .row{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){.rosette,main.busy .rosette{animation:none}button{transition:none}}
</style>
</head>
<body>
<main id="sheet">
<svg class="rosette" id="rosette" viewBox="-130 -130 260 260" aria-hidden="true"><path id="r1"/><path id="r2"/></svg>

<h1>CipherX</h1>
<p class="sub">Lock a file with a password, or unlock one you locked earlier.</p>
<label for="f">File</label>
<span class="hint" id="limit"></span>
<input id="f" type="file" aria-describedby="limit">
<label for="p">Password</label>
<input id="p" type="password" autocomplete="off">
<div class="row"><button id="enc">Encrypt file</button><button id="dec">Decrypt file</button></div>
<p id="msg" role="status" aria-live="polite"></p>
<small>AES-256-GCM with a PBKDF2-SHA256 key derived from your password. Files are processed in memory and never stored. Lost passwords cannot be recovered.</small>
<div class="band" aria-hidden="true"><span>AES-256-GCM</span><span>PBKDF2-SHA256</span><span>Never stored</span></div>
</main>
<script>
const $=id=>document.getElementById(id),msg=$('msg'),sheet=$('sheet');

// Decorative rosette (hypotrochoid curves); it carries no data.
function hypo(R,r,d,s){
  const g=(a,b)=>b?g(b,a%b):a,turns=r/g(R,r),n=900;let p='';
  for(let i=0;i<=n;i++){
    const t=i/n*2*Math.PI*turns;
    const x=(R-r)*Math.cos(t)+d*Math.cos((R-r)/r*t),y=(R-r)*Math.sin(t)-d*Math.sin((R-r)/r*t);
    p+=(i?'L':'M')+(x*s).toFixed(1)+','+(y*s).toFixed(1);
  }
  return p;
}
$('r1').setAttribute('d',hypo(48,15,28,2));
$('r2').setAttribute('d',hypo(48,9,20,2));

// Vercel rejects requests over ~4.5 MB before the app sees them; other hosts accept up to the server limit.
const HOSTED=/\.vercel\.app$/.test(location.hostname),LIMIT_MB=HOSTED?4:100;
$('limit').textContent=HOSTED?'Up to 4 MB on this site. For larger files, use the desktop app.':'Up to '+LIMIT_MB+' MB.';

function say(cls,text){msg.className=cls;msg.textContent=text}
function busy(on){$('enc').disabled=$('dec').disabled=on;sheet.classList.toggle('busy',on);sheet.setAttribute('aria-busy',on)}

async function run(mode){
  const f=$('f').files[0];
  say('','');
  if(!f){say('err','Choose a file first.');return}
  if(!$('p').value){say('err','Enter a password.');return}
  if(f.size>LIMIT_MB*1024*1024){say('err','This file is '+(f.size/1048576).toFixed(1)+' MB. The limit here is '+LIMIT_MB+' MB.');return}
  const fd=new FormData();fd.append('file',f);fd.append('password',$('p').value);
  busy(true);msg.textContent=(mode==='encrypt'?'Encrypting':'Decrypting')+'…';
  try{
    const r=await fetch('/api/'+mode,{method:'POST',body:fd});
    if(!r.ok){
      let e;try{e=(await r.json()).error}catch{}
      if(!e)e=r.status===413?'This file is too large for this site.':'The server had a problem. Try again in a moment.';
      throw new Error(e);
    }
    const name=r.headers.get('X-Filename')||'output',url=URL.createObjectURL(await r.blob());
    const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
    say('ok',(mode==='encrypt'?'Encrypted':'Decrypted')+': '+name);
  }catch(e){say('err',e.message)}
  busy(false);
}
$('enc').onclick=()=>run('encrypt');$('dec').onclick=()=>run('decrypt');
</script>
</body>
</html>
